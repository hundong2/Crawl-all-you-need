[project]
name = "sitebooker"
version = "0.1.0"
description = "Multi-LLM website to book generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.13.4",
  "markdownify==1.1.0",
  "pydantic==2.11.7",
  "python-dotenv==1.1.1",
  "litellm==1.74.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[project.scripts]
sitebooker = "sitebooker.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
